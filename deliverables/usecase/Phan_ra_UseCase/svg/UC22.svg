<text x="800" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#222222">Phân rã use case UC22 – Chấm bài và nhận xét</text>
<line x1="206" y1="501.5" x2="479.061" y2="569.136" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="206" y1="676.5" x2="463.227" y2="636.494" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="830" y1="609" x2="1050" y2="239" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="830" y1="609" x2="1050" y2="424" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="830" y1="609" x2="1050" y2="609" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="830" y1="609" x2="1050" y2="794" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="1050" y1="979" x2="830" y2="609" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<ellipse cx="640" cy="609" rx="190" ry="75" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="640" y="609" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Chấm bài và nhận xét</text>
<ellipse cx="1265" cy="239" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="225.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC22.1</text>
<text x="1265" y="252.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem danh sách bài đã nộp</text>
<ellipse cx="1265" cy="424" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="396.17" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC22.2</text>
<text x="1265" y="424" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem câu trả lời và kết quả hiện</text>
<text x="1265" y="451.83" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">có</text>
<ellipse cx="1265" cy="609" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="595.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC22.3</text>
<text x="1265" y="622.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Chấm điểm tổng và lưu nhận xét</text>
<ellipse cx="1265" cy="794" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="780.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC22.4</text>
<text x="1265" y="807.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Gửi thông báo kết quả chấm</text>
<ellipse cx="1265" cy="979" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="951.17" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC22.5</text>
<text x="1265" y="979" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Điều chỉnh điểm và nhận xét đã</text>
<text x="1265" y="1006.83" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">chấm</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="461.5" r="13"/><path d="M173,474.5 V519.5 M142,494.5 H204 M173,519.5 L143,554.5 M173,519.5 L203,554.5"/></g>
<text x="173" y="580.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Giáo viên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="636.5" r="13"/><path d="M173,649.5 V694.5 M142,669.5 H204 M173,694.5 L143,729.5 M173,694.5 L203,729.5"/></g>
<text x="173" y="755.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="408" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="424" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="500.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="516.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="593" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="609" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="685.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="701.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="887.82" y="778" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="794" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="1105.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="1141.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Điều kiện và giới hạn xem trong tài liệu đối chiếu đi kèm.</text>
</svg>
