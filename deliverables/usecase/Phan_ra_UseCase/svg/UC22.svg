<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1204" viewBox="0 0 1600 1204">
<title>Phân rã use case UC22 – Chấm bài và nhận xét</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
