<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1204" viewBox="0 0 1600 1204">
<title>Phân rã use case UC13 – Theo dõi tiến độ học tập</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
