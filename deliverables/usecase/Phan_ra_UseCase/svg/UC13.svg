<text x="800" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#222222">Phân rã use case UC13 – Theo dõi tiến độ học tập</text>
<line x1="206" y1="589" x2="451.282" y2="600.303" fill="none" stroke="#333333" stroke-width="2"/>
