<text x="640" y="609" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Theo dõi tiến độ học tập</text>
<ellipse cx="1265" cy="239" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="225.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC13.1</text>
<text x="1265" y="252.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem tổng quan học tập</text>
<ellipse cx="1265" cy="424" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="410.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC13.2</text>
<text x="1265" y="437.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem tiến độ từng khóa học</text>
<ellipse cx="1265" cy="609" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="595.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC13.3</text>
<text x="1265" y="622.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem thời gian học trong tuần</text>
<ellipse cx="1265" cy="794" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="780.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC13.4</text>
<text x="1265" y="807.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem lịch sử và điểm bài làm</text>
<ellipse cx="1265" cy="979" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="965.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC13.5</text>
<text x="1265" y="992.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Mở kết quả chi tiết bài làm</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="549" r="13"/><path d="M173,562 V607 M142,582 H204 M173,607 L143,642 M173,607 L203,642"/></g>
<text x="173" y="668" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Học viên</text>
<rect x="886.062" y="408" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="424" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="500.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="516.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="593" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="609" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="685.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="701.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="887.82" y="778" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="794" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="1105.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="1141.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Điều kiện và giới hạn xem trong tài liệu đối chiếu đi kèm.</text>
</svg>
