<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1046" viewBox="0 0 1600 1046">
<title>Phân rã use case UC19 – Quản lý câu hỏi và đáp án</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="open-arrow" viewBox="0 0 18 16" refX="17" refY="8" markerWidth="18" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L17,8 L1,15" fill="none" stroke="#FF4081" stroke-width="2"/></marker></defs>
<text x="800" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#222222">Phân rã use case UC19 – Quản lý câu hỏi và đáp án</text>
<line x1="206" y1="422.5" x2="479.061" y2="490.136" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="206" y1="597.5" x2="463.227" y2="557.494" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="830" y1="530" x2="1050" y2="252.5" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="1050" y1="437.5" x2="830" y2="530" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="1050" y1="622.5" x2="830" y2="530" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="1050" y1="807.5" x2="830" y2="530" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<ellipse cx="640" cy="530" rx="190" ry="75" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="640" y="530" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Quản lý câu hỏi và đáp án</text>
<ellipse cx="1265" cy="252.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="224.67" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC19.1</text>
<text x="1265" y="252.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem câu hỏi và đáp án của bộ</text>
<text x="1265" y="280.33" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">bài tập</text>
<ellipse cx="1265" cy="437.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="423.585" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC19.2</text>
<text x="1265" y="451.415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Thêm câu hỏi và đáp án</text>
<ellipse cx="1265" cy="622.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="608.585" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC19.3</text>
<text x="1265" y="636.415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Sửa câu hỏi, đáp án và lời giải</text>
<ellipse cx="1265" cy="807.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="793.585" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC19.4</text>
<text x="1265" y="821.415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xóa câu hỏi</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="382.5" r="13"/><path d="M173,395.5 V440.5 M142,415.5 H204 M173,440.5 L143,475.5 M173,440.5 L203,475.5"/></g>
<text x="173" y="501.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Giáo viên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="557.5" r="13"/><path d="M173,570.5 V615.5 M142,590.5 H204 M173,615.5 L143,650.5 M173,615.5 L203,650.5"/></g>
<text x="173" y="676.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="375.25" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="391.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="887.82" y="467.75" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="483.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="560.25" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="576.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="652.75" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="668.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="947.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="983.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Luồng cơ sở: xem danh sách; điểm mở rộng: chọn thao tác quản lý.</text>
</svg>
