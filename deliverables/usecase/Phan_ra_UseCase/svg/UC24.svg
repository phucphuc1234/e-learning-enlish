<text x="940" y="701.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="778" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="794" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="870.5" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="886.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="963" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="979" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="1055.5" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="1071.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="1475.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="1511.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Luồng cơ sở: xem danh sách; điểm mở rộng: chọn thao tác quản lý.</text>
</svg>
