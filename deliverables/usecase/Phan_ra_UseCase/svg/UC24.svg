<text x="1265" y="1177.91" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xóa tài khoản</text>
<ellipse cx="1265" cy="1349" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="1335.09" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC25</text>
<text x="1265" y="1362.91" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Cấp và thay đổi vai trò</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="734" r="13"/><path d="M173,747 V792 M142,767 H204 M173,792 L143,827 M173,792 L203,827"/></g>
<text x="173" y="853" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="500.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="516.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
