<text x="1265" y="807.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Khóa hoặc mở khóa tài khoản</text>
<ellipse cx="1265" cy="979" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="965.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC24.5</text>
<text x="1265" y="992.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Đặt lại mật khẩu tài khoản</text>
<ellipse cx="1265" cy="1164" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
