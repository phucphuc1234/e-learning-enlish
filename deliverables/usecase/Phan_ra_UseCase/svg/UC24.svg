<ellipse cx="1265" cy="239" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="225.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC24.1</text>
<text x="1265" y="252.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem danh sách tài khoản</text>
<ellipse cx="1265" cy="424" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="410.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC24.2</text>
<text x="1265" y="437.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Tạo tài khoản</text>
<ellipse cx="1265" cy="609" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
