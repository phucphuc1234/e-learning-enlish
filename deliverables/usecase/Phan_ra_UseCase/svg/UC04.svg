<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1046" viewBox="0 0 1600 1046">
<title>Phân rã use case UC04 – Quản lý hồ sơ cá nhân</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="open-arrow" viewBox="0 0 18 16" refX="17" refY="8" markerWidth="18" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L17,8 L1,15" fill="none" stroke="#FF4081" stroke-width="2"/></marker></defs>
<text x="800" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#222222">Phân rã use case UC04 – Quản lý hồ sơ cá nhân</text>
<line x1="206" y1="335" x2="514.598" y2="473.656" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="206" y1="510" x2="451.282" y2="521.303" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="206" y1="685" x2="499.108" y2="580.318" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="830" y1="530" x2="1050" y2="437.5" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="1050" y1="622.5" x2="830" y2="530" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<ellipse cx="640" cy="530" rx="190" ry="75" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="640" y="530" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Quản lý hồ sơ cá nhân</text>
<ellipse cx="1265" cy="437.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="423.585" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC04.1</text>
<text x="1265" y="451.415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem thông tin hồ sơ</text>
<ellipse cx="1265" cy="622.5" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="608.585" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC04.2</text>
<text x="1265" y="636.415" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Cập nhật thông tin hồ sơ</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="295" r="13"/><path d="M173,308 V353 M142,328 H204 M173,353 L143,388 M173,353 L203,388"/></g>
<text x="173" y="414" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Học viên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="470" r="13"/><path d="M173,483 V528 M142,503 H204 M173,528 L143,563 M173,528 L203,563"/></g>
<text x="173" y="589" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Giáo viên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="645" r="13"/><path d="M173,658 V703 M142,678 H204 M173,703 L143,738 M173,703 L203,738"/></g>
<text x="173" y="764" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="467.75" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="483.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="887.82" y="560.25" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="576.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="947.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="983.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Điều kiện và giới hạn xem trong tài liệu đối chiếu đi kèm.</text>
</svg>
