<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1046" viewBox="0 0 1600 1046">
<title>Phân rã use case UC25 – Cấp và thay đổi vai trò</title>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="open-arrow" viewBox="0 0 18 16" refX="17" refY="8" markerWidth="18" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L17,8 L1,15" fill="none" stroke="#FF4081" stroke-width="2"/></marker></defs>
<text x="800" y="80" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="bold" fill="#222222">Phân rã use case UC25 – Cấp và thay đổi vai trò</text>
<line x1="206" y1="510" x2="451.282" y2="521.303" fill="none" stroke="#333333" stroke-width="2"/>
<line x1="830" y1="530" x2="1050" y2="345" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="830" y1="530" x2="1050" y2="530" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<line x1="830" y1="530" x2="1050" y2="715" fill="none" stroke="#FF4081" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#open-arrow)"/>
<ellipse cx="640" cy="530" rx="190" ry="75" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="640" y="530" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Cấp và thay đổi vai trò</text>
<ellipse cx="1265" cy="345" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="331.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC25.1</text>
<text x="1265" y="358.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Chọn tài khoản và vai trò mới</text>
<ellipse cx="1265" cy="530" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="502.17" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC25.2</text>
<text x="1265" y="530" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Kiểm tra điều kiện thay đổi vai</text>
<text x="1265" y="557.83" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">trò</text>
<ellipse cx="1265" cy="715" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="687.17" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC25.3</text>
<text x="1265" y="715" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Áp dụng vai trò và cập nhật</text>
<text x="1265" y="742.83" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">phiên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="470" r="13"/><path d="M173,483 V528 M142,503 H204 M173,528 L143,563 M173,528 L203,563"/></g>
<text x="173" y="589" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="421.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="437.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="514" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="530" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="886.062" y="606.5" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="622.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<text x="100" y="947.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="983.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Điều kiện và giới hạn xem trong tài liệu đối chiếu đi kèm.</text>
</svg>
