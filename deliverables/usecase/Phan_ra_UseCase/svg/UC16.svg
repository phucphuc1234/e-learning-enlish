<text x="640" y="701.5" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="25" font-weight="normal" fill="#111111">Quản lý khóa học</text>
<ellipse cx="1265" cy="239" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="211.17" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC16.1</text>
<text x="1265" y="239" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xem danh sách khóa học được</text>
<text x="1265" y="266.83" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">quản lý</text>
