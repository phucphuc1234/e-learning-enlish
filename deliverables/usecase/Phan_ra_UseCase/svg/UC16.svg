<text x="1265" y="1177.91" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Xóa khóa học</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="554" r="13"/><path d="M173,567 V612 M142,587 H204 M173,612 L143,647 M173,612 L203,647"/></g>
<text x="173" y="673" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Giáo viên</text>
<g stroke="#333333" stroke-width="2.4" fill="none"><circle cx="173" cy="729" r="13"/><path d="M173,742 V787 M142,762 H204 M173,787 L143,822 M173,787 L203,822"/></g>
<text x="173" y="848" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="22" font-weight="normal" fill="#333333">Quản trị viên</text>
<rect x="886.062" y="454.25" width="107.875" height="32" fill="#FFFFFF"/>
<text x="940" y="470.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«include»</text>
<rect x="887.82" y="546.75" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="562.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="639.25" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="655.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="731.75" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="747.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="824.25" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="840.25" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<rect x="887.82" y="916.75" width="104.359" height="32" fill="#FFFFFF"/>
<text x="940" y="932.75" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="21" font-weight="normal" fill="#FF4081">«extend»</text>
<text x="100" y="1290.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">«include»: bắt buộc trong luồng thành công; «extend»: tùy chọn hoặc có điều kiện.</text>
<text x="100" y="1326.5" text-anchor="start" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="18" font-weight="normal" fill="#444444">Luồng cơ sở: xem danh sách; điểm mở rộng: chọn thao tác quản lý.</text>
</svg>
