<text x="1265" y="437.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Tìm kiếm hoặc lọc khóa học</text>
<ellipse cx="1265" cy="609" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
