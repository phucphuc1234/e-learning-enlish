<text x="1265" y="622.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Thêm khóa học</text>
<ellipse cx="1265" cy="794" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
<text x="1265" y="780.085" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">UC16.4</text>
<text x="1265" y="807.915" text-anchor="middle" dominant-baseline="central" font-family="Arial, Liberation Sans, sans-serif" font-size="23" font-weight="normal" fill="#111111">Sửa thông tin khóa học</text>
<ellipse cx="1265" cy="979" rx="215" ry="69" fill="#FFF2CC" stroke="#FF4081" stroke-width="2"/>
