<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1840" viewBox="0 0 2800 1840" version="1.1"><title>Sơ đồ use case tổng quát – Hệ thống E-Learning dạy và luyện thi tiếng Anh</title><desc>Bốn tác nhân, tám mục tiêu tổng quát, mười bảy liên kết. Tác nhân tham gia ít nhất một chức năng của nhóm; quyền cụ thể được thể hiện ở sơ đồ phân rã.</desc><rect x="0" y="0" width="2800" height="1840" fill="white" /><rect stroke-width="3" x="260" y="100" width="2240" height="1560" fill="none" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" x="1380" y="165" fill="black"><tspan x="1380" dy="0">HỆ THỐNG E-LEARNING</tspan><tspan x="1380" dy="55">DẠY VÀ LUYỆN THI TIẾNG ANH</tspan></text><polyline stroke-width="2.3" stroke-linejoin="round" data-source="KH" data-target="TQ01" points="110,500 310,500 310,420 450,420" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="KH" data-target="TQ02" points="110,500 335,500 335,730 450,730" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="HV" data-target="TQ01" points="110,1190 360,1190 360,420 450,420" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="HV" data-target="TQ02" points="110,1190 385,1190 385,730 450,730" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="HV" data-target="TQ03" points="110,1190 410,1190 410,1040 450,1040" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="HV" data-target="TQ04" points="110,1190 435,1190 435,1350 450,1350" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="GV" data-target="TQ01" points="2650,500 2540,500 2540,280 1210,280 1210,420 1150,420" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="GV" data-target="TQ02" points="2650,500 2560,500 2560,300 1250,300 1250,730 1150,730" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="GV" data-target="TQ05" points="2650,500 2370,500 2370,530 2330,530" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="GV" data-target="TQ06" points="2650,500 2390,500 2390,840 2330,840" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="GV" data-target="TQ08" points="2650,500 2410,500 2410,1460 2330,1460" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ01" points="2650,1240 2540,1240 2540,1570 1290,1570 1290,420 1150,420" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ02" points="2650,1240 2560,1240 2560,1600 1330,1600 1330,730 1150,730" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ05" points="2650,1240 2435,1240 2435,530 2330,530" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ06" points="2650,1240 2450,1240 2450,840 2330,840" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ07" points="2650,1240 2465,1240 2465,1150 2330,1150" fill="none" stroke="black" /><polyline stroke-width="2.3" stroke-linejoin="round" data-source="AD" data-target="TQ08" points="2650,1240 2480,1240 2480,1460 2330,1460" fill="none" stroke="black" /><ellipse stroke-width="3" cx="800" cy="420" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="800" y="407" fill="black"><tspan x="800" dy="0">TQ01</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="800" y="450" fill="black"><tspan x="800" dy="0">Sử dụng tài khoản cá nhân</tspan></text><ellipse stroke-width="3" cx="800" cy="730" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="800" y="717" fill="black"><tspan x="800" dy="0">TQ02</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="800" y="760" fill="black"><tspan x="800" dy="0">Tra cứu và ghi danh khóa học</tspan></text><ellipse stroke-width="3" cx="800" cy="1040" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="800" y="1027" fill="black"><tspan x="800" dy="0">TQ03</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="800" y="1070" fill="black"><tspan x="800" dy="0">Học bài và theo dõi học tập</tspan></text><ellipse stroke-width="3" cx="800" cy="1350" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="800" y="1314" fill="black"><tspan x="800" dy="0">TQ04</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="800" y="1357" fill="black"><tspan x="800" dy="0">Luyện tập, kiểm tra</tspan><tspan x="800" dy="40">và xem kết quả</tspan></text><ellipse stroke-width="3" cx="1980" cy="530" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="1980" y="494" fill="black"><tspan x="1980" dy="0">TQ05</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="1980" y="537" fill="black"><tspan x="1980" dy="0">Quản lý nội dung và</tspan><tspan x="1980" dy="40">lộ trình giảng dạy</tspan></text><ellipse stroke-width="3" cx="1980" cy="840" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="1980" y="804" fill="black"><tspan x="1980" dy="0">TQ06</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="1980" y="847" fill="black"><tspan x="1980" dy="0">Tổ chức kiểm tra và</tspan><tspan x="1980" dy="40">đánh giá học viên</tspan></text><ellipse stroke-width="3" cx="1980" cy="1150" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="1980" y="1114" fill="black"><tspan x="1980" dy="0">TQ07</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="1980" y="1157" fill="black"><tspan x="1980" dy="0">Quản trị tài khoản</tspan><tspan x="1980" dy="40">và chương trình</tspan></text><ellipse stroke-width="3" cx="1980" cy="1460" rx="350" ry="80" fill="white" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="bold" text-anchor="middle" x="1980" y="1447" fill="black"><tspan x="1980" dy="0">TQ08</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="1980" y="1490" fill="black"><tspan x="1980" dy="0">Theo dõi thống kê</tspan></text><circle stroke-width="3.5" cx="110" cy="422" r="22" fill="white" stroke="black" /><path stroke-width="3.5" stroke-linecap="round" d="M 110 444 V 512 M 72 478 H 148 M 110 512 L 74 566 M 110 512 L 146 566" fill="none" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="110" y="616" fill="black"><tspan x="110" dy="0">Khách</tspan></text><circle stroke-width="3.5" cx="110" cy="1112" r="22" fill="white" stroke="black" /><path stroke-width="3.5" stroke-linecap="round" d="M 110 1134 V 1202 M 72 1168 H 148 M 110 1202 L 74 1256 M 110 1202 L 146 1256" fill="none" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="110" y="1306" fill="black"><tspan x="110" dy="0">Học viên</tspan></text><circle stroke-width="3.5" cx="2650" cy="422" r="22" fill="white" stroke="black" /><path stroke-width="3.5" stroke-linecap="round" d="M 2650 444 V 512 M 2612 478 H 2688 M 2650 512 L 2614 566 M 2650 512 L 2686 566" fill="none" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="2650" y="616" fill="black"><tspan x="2650" dy="0">Giáo viên</tspan></text><circle stroke-width="3.5" cx="2650" cy="1162" r="22" fill="white" stroke="black" /><path stroke-width="3.5" stroke-linecap="round" d="M 2650 1184 V 1252 M 2612 1218 H 2688 M 2650 1252 L 2614 1306 M 2650 1252 L 2686 1306" fill="none" stroke="black" /><text font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="2650" y="1356" fill="black"><tspan x="2650" dy="0">Quản trị viên</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="bold" text-anchor="middle" x="1380" y="1720" fill="black"><tspan x="1380" dy="0">SƠ ĐỒ USE CASE TỔNG QUÁT</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" x="1380" y="1770" fill="black"><tspan x="1380" dy="0">Đường nối: tác nhân tham gia ít nhất một chức năng trong nhóm; quyền chi tiết thể hiện ở sơ đồ phân rã.</tspan></text><text font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" x="1380" y="1815" fill="black"><tspan x="1380" dy="0">Khách là người chưa đăng nhập, có thể đã có tài khoản.</tspan></text></svg>